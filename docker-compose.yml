services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: simple_bank
    ports:
      - "5433:5432"   # 5432 taken by another local postgres; host->5433
    volumes:
      - pgdata:/var/lib/postgresql   # PG18+ เก็บ data ใน subdir ตาม major version (ห้าม mount ที่ /data)

volumes:
  pgdata:
