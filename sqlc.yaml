version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migration"
    queries: "db/query"
    gen:
      go:
        package: "db"
        out: "db/sqlc"
        emit_json_tags: true
        overrides:
          - column: "users.password"
            go_struct_tag: 'json:"-"'   # password ไม่ serialize ออก JSON เด็ดขาด
